[build]
  base = "Smart-Campus-master/smart-campus-full-project/client"
  # node_modules is committed from Windows (no exec bits, wrong native binaries), so reinstall cleanly
  command = "npm ci && npm run build"
  publish = "dist"

# Client-side routing (React Router BrowserRouter)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
