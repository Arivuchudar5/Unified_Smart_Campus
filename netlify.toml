[build]
  base = "Smart-Campus-master/smart-campus-full-project/client"
  # npm ci reinstalls from the lockfile, replacing the committed Windows-built node_modules
  command = "npm ci && npm run build"
  publish = "dist"

# Single-page app: serve index.html for client-side routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
